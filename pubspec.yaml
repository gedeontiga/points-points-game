name: "squares_conquest"
description: "Implementation of squares conquest game."
publish_to: "none"

version: 5.0.0+5

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  flutter_colorpicker: ^1.1.0
  gif_view: ^0.4.4
  intl: ^0.20.2
  riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  meta: ^1.16.0

dev_dependencies:
  flutter_launcher_icons: ^0.9.2
  flutter_test:
    sdk: flutter
  # rename: ^3.0.2 # Use the latest version
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
flutter:
  assets:
    - "assets/squares_conquest_logo.gif"
  uses-material-design: true
flutter_icons:
  android: true
  ios: true
  image_path: "assets/squares_conquest_logo.png"

